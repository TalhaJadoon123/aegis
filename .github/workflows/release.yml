name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Resolve and verify the release version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          # On a tag push the ref is `v0.1.2`; a manual dispatch passes the
          # version explicitly. Either way the release version is bare.
          RAW="${INPUT_VERSION:-${GITHUB_REF_NAME}}"
          VERSION="${RAW#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # Fails if any manifest, constant, chart value, installer or doc
          # still points at a previous release.
          npm run check:versions -- "$VERSION"

      - name: Install TypeScript for typechecking
        run: npm install --no-save --no-audit --no-fund typescript@5.7.2

      - name: Run full verification
        run: npm run verify

      - name: Build publishable tarball
        run: npm run package

      - name: Verify tarball
        run: npm run package:verify

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint and package the Helm chart
        run: |
          helm lint infra/helm/aegis
          helm lint infra/helm/aegis \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true
          helm package infra/helm/aegis -d dist

      - name: Generate SBOM
        run: npm run sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Aegis ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/talhajadoon123-aegis-*.tgz
            dist/aegis-*.tgz
            dist/sbom.json
            install.ps1
            install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The workflow token is scoped to this repository and has packages:write,
      # so the image can be published to GHCR without a personal access token.
      # This runs after the release so a registry hiccup cannot prevent the
      # tarball, chart and SBOM from shipping.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/sandbox/Dockerfile
          push: true
          # The bare-version tag is the one the Helm chart defaults to
          # (`image.tag`), so `helm install` works without overriding it. The
          # `v`-prefixed tag matches the GitHub release for humans.
          tags: |
            ghcr.io/talhajadoon123/aegis:${{ steps.version.outputs.version }}
            ghcr.io/talhajadoon123/aegis:${{ github.ref_name }}
            ghcr.io/talhajadoon123/aegis:latest
          labels: |
            org.opencontainers.image.source=https://github.com/TalhaJadoon123/aegis
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the pushed image
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/talhajadoon123/aegis:${{ steps.version.outputs.version }}"

          docker run --rm "$IMAGE" --version

          # The dashboard is what `helm install` runs, and a broken asset path
          # once made it serve 404 for its own index.html. Prove the image
          # actually serves the UI, not just that the binary prints a version.
          docker run -d --name aegis-smoke -p 18080:8080 \
            -e AEGIS_DASHBOARD_TOKEN=release-smoke \
            "$IMAGE" desktop --no-open --host 0.0.0.0 --port 8080 --data /tmp/aegis

          trap 'docker rm -f aegis-smoke >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo '--- /healthz ---'
          curl -fsS http://127.0.0.1:18080/healthz
          echo
          echo '--- / (dashboard UI) ---'
          curl -fsS -o /dev/null -w 'status=%{http_code} type=%{content_type}\n' \
            http://127.0.0.1:18080/
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<title>' \
            || { echo 'dashboard index.html has no <title>'; exit 1; }
          echo '--- /app.css ---'
          curl -fsS -o /dev/null -w 'status=%{http_code} type=%{content_type}\n' \
            http://127.0.0.1:18080/app.css
          echo '--- /metrics ---'
          curl -fsS http://127.0.0.1:18080/metrics | head -5

      - name: Check npm credentials
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured; skipping npm publish. The release assets are still installable with npm install -g <tarball URL>."
          fi

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        run: npm publish dist/talhajadoon123-aegis-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        if: steps.npm.outputs.publish == 'true'
        run: npm view @talhajadoon123/aegis version