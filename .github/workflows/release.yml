name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: 'npm'

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag version ($TAG_VERSION) does not match package.json version ($PKG_VERSION)"
            exit 1
          fi
          echo "Version matches: $PKG_VERSION"

      - name: Install TypeScript for typechecking
        run: npm install --no-save --no-audit --no-fund typescript@5.7.2

      - name: Run full verification
        run: npm run verify

      - name: Build publishable tarball
        run: npm run package

      - name: Verify tarball
        run: npm run package:verify

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint and package the Helm chart
        run: |
          helm lint infra/helm/aegis
          helm lint infra/helm/aegis \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true
          helm package infra/helm/aegis -d dist

      - name: Generate SBOM
        run: npm run sbom

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Aegis ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            dist/talhajadoon123-aegis-*.tgz
            dist/aegis-*.tgz
            dist/sbom.json
            install.ps1
            install.sh
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check npm credentials
        id: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is not configured; skipping npm publish. The release assets are still installable with npm install -g <tarball URL>."
          fi

      - name: Publish to npm
        if: steps.npm.outputs.publish == 'true'
        run: npm publish dist/talhajadoon123-aegis-*.tgz --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package
        if: steps.npm.outputs.publish == 'true'
        run: npm view @talhajadoon123/aegis version