apiVersion: v1
kind: Service
metadata:
  name: {{ include "aegis.fullname" . }}
  labels:
    {{- include "aegis.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    {{- if .Values.serviceMonitor.enabled }}
    - name: metrics
      port: {{ .Values.env.AEGIS_OBSERVABILITY_PROMETHEUS_PORT | default 9464 }}
      targetPort: metrics
      protocol: TCP
    {{- end }}
  selector:
    {{- include "aegis.selectorLabels" . | nindent 4 }}