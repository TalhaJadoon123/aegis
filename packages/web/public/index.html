<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Aegis — the security platform for AI agents</title>
<link rel="stylesheet" href="/app.css" />
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">A</div>
      <div>
        <div class="brand-name">Aegis</div>
        <div class="brand-sub">AI agent security</div>
      </div>
    </div>

    <nav class="nav">
      <div class="nav-label">Overview</div>
      <a href="#overview" class="active" data-view="overview"><span class="ico">◈</span> Security posture</a>
      <a href="#findings" data-view="findings"><span class="ico">⚑</span> Findings <span class="pill-count" id="nav-findings">0</span></a>
      <a href="#graph" data-view="graph"><span class="ico">◉</span> Supply chain graph</a>
      <a href="#redteam" data-view="redteam"><span class="ico">⚗</span> Red team</a>
      <a href="#behaviour" data-view="behaviour"><span class="ico">◎</span> Behaviour</a>
      <a href="#compliance" data-view="compliance"><span class="ico">§</span> Compliance</a>
      <a href="#intel" data-view="intel"><span class="ico">✦</span> Threat graph</a>
    </nav>

    <div class="sidebar-foot">
      <div>Scanning <code>aegis scan .</code></div>
    </div>
  </aside>

  <main class="main">

    <div class="topbar">
      <div>
        <h1 id="view-title">Security posture</h1>
        <div class="crumb" id="view-crumb">Live across every project</div>
      </div>
      <div class="topbar-actions">
        <input class="inp" id="token" type="password" placeholder="Dashboard token" />
        <div class="btn-group" id="range">
          <button data-days="7" class="on">7d</button>
          <button data-days="30">30d</button>
          <button data-days="90">All</button>
        </div>
        <button class="btn" id="btn-refresh">Refresh</button>
        <button class="btn btn-primary" id="btn-scan">Run scan</button>
      </div>
    </div>

    <div id="app"></div>

  </main>
</div>

<script type="module">
/* ==========================================================================
   Aegis dashboard.
   No framework, no CDN, no build step. Everything below is plain DOM.
   ========================================================================== */

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];

const state = {
  scans: [],
  selected: null,
  detail: null,
  trends: [],
  view: 'overview',
  days: 30,
  loading: false,
};

const esc = (s) => String(s ?? '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;')
  .replace(/>/g, '&gt;').replace(/"/g, '&quot;');

const token = () => $('#token').value.trim();

async function api(path) {
  const res = await fetch(path, {
    headers: token() ? { authorization: 'Bearer ' + token() } : {},
  });
  if (!res.ok) {
    const body = await res.json().catch(() => ({}));
    throw new Error(body.error || `HTTP ${res.status}`);
  }
  return res.json();
}

/* ---------- data ---------- */

async function load() {
  state.loading = true;
  try {
    state.scans = await api('/api/scans');
    state.selected = state.selected ?? state.scans[0]?.id ?? null;
    if (state.selected) state.detail = await api('/api/scans/' + encodeURIComponent(state.selected));
    const t = await api('/api/trends');
    state.trends = t.points || [];
  } catch (e) {
    state.scans = [];
    state.detail = null;
    state.error = e.message;
  }
  state.loading = false;
}

/* ---------- helpers ---------- */

const SEV_ORDER = ['critical', 'high', 'medium', 'low', 'info'];

function visibleScans() {
  if (state.days >= 90) return state.trends;
  const cutoff = Date.now() - state.days * 86400000;
  return state.trends.filter((p) => new Date(p.at).getTime() >= cutoff);
}

function currentFindings() {
  return (state.detail?.findings ?? []).slice().sort((a, b) =>
    SEV_ORDER.indexOf(a.severity) - SEV_ORDER.indexOf(b.severity));
}

function counts() {
  const c = { critical: 0, high: 0, medium: 0, low: 0, info: 0 };
  for (const f of currentFindings()) c[f.severity]++;
  return c;
}

function gradeColor(grade) {
  return { A: '#34d399', B: '#34d399', C: '#facc15', D: '#fb923c', F: '#fb4a5e' }[grade] ?? '#7f91ad';
}

function scoreColor(score) {
  if (score >= 90) return '#34d399';
  if (score >= 75) return '#facc15';
  if (score >= 60) return '#fb923c';
  return '#fb4a5e';
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function relTime(iso) {
  const diff = (Date.now() - new Date(iso).getTime()) / 1000;
  if (diff < 3600) return `${Math.round(diff / 60)}m ago`;
  if (diff < 86400) return `${Math.round(diff / 3600)}h ago`;
  return `${Math.round(diff / 86400)}d ago`;
}

/* ---------- ring ---------- */

function scoreRing(score, grade) {
  const R = 50, C = 2 * Math.PI * R;
  const offset = C * (1 - score / 100);
  const color = scoreColor(score);
  return `
    <div class="ring">
      <svg width="116" height="116" viewBox="0 0 116 116">
        <circle class="ring-track" cx="58" cy="58" r="${R}" fill="none" stroke-width="9"/>
        <circle class="ring-value" cx="58" cy="58" r="${R}" fill="none" stroke-width="9"
          stroke="${color}" stroke-dasharray="${C}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="ring-text grade-${esc(grade)}">${score}<span class="g">grade ${esc(grade)}</span></div>
    </div>`;
}

/* ---------- views ---------- */

const VIEWS = {
  overview: { title: 'Security posture', crumb: 'Live across every project' },
  findings: { title: 'Findings', crumb: 'Every issue, with evidence and remediation' },
  graph: { title: 'MCP supply chain graph', crumb: 'Servers, tools, and the paths data takes' },
  redteam: { title: 'Red team', crumb: 'Evolutionary prompt search against your agent' },
  behaviour: { title: 'Behavioural fingerprint', crumb: 'What the agent does, not what it says' },
  compliance: { title: 'Compliance', crumb: 'SOC 2 · ISO 27001 · GDPR · EU AI Act · NIST' },
  intel: { title: 'Threat graph', crumb: 'Known techniques and how they connect' },
};

function render() {
  const meta = VIEWS[state.view];
  $('#view-title').textContent = meta.title;
  $('#view-crumb').textContent = meta.crumb;

  $$('.nav a').forEach((a) => a.classList.toggle('active', a.dataset.view === state.view));
  $('#nav-findings').textContent = currentFindings().length;

  if (state.error) {
    $('#app').innerHTML = `<div class="card"><div class="empty">
      <div class="big">⚠</div>
      <p style="color:#fb923c">${esc(state.error)}</p>
      <p class="t-dim" style="margin-top:8px">
        If the dashboard is running behind a token, enter it above.
      </p></div></div>`;
    return;
  }

  if (state.loading && !state.scans.length) {
    $('#app').innerHTML = `<div class="grid kpis">
      ${Array.from({ length: 4 }, () => '<div class="kpi"><div class="skeleton" style="height:62px"></div></div>').join('')}
    </div><div class="card"><div class="skeleton" style="height:260px"></div></div>`;
    return;
  }

  if (!state.scans.length) {
    $('#app').innerHTML = `<div class="card"><div class="empty">
      <div class="big">◈</div>
      <p>No scans yet.</p>
      <p class="t-dim" style="margin-top:10px">Produce one with<br/>
        <code class="chip accent" style="margin-top:8px">aegis scan . --format json --output .aegis/dashboard/scan.json</code></p>
    </div></div>`;
    return;
  }

  $('#app').innerHTML = ({
    overview: viewOverview,
    findings: viewFindings,
    graph: viewGraph,
    redteam: viewRedTeam,
    behaviour: viewBehaviour,
    compliance: viewCompliance,
    intel: viewIntel,
  })[state.view]();
}

/* ---------- overview ---------- */

function viewOverview() {
  const d = state.detail;
  const c = counts();
  const pts = visibleScans();
  const delta = pts.length > 1 ? pts[pts.length - 1].score - pts[0].score : 0;
  const total = Object.values(c).reduce((a, b) => a + b, 0);

  return `
  <div class="grid kpis">
    <div class="kpi">
      <div class="kpi-label">Security score</div>
      <div class="kpi-value" style="color:${scoreColor(d.score)}">${d.score}<span class="unit">/100</span></div>
      <div class="kpi-delta ${delta > 0 ? 'up' : delta < 0 ? 'down' : 'flat'}">
        ${delta > 0 ? '▲' : delta < 0 ? '▼' : '—'} ${delta === 0 ? 'no change' : Math.abs(delta) + ' pts'} over ${state.days === 90 ? 'all time' : state.days + 'd'}
      </div>
    </div>
    <div class="kpi ${c.critical ? 'crit' : 'ok'}">
      <div class="kpi-label">Critical</div>
      <div class="kpi-value" style="color:${c.critical ? 'var(--critical)' : 'var(--ok)'}">${c.critical}</div>
      <div class="kpi-delta t-dim">${c.critical ? 'fix first' : 'none open'}</div>
    </div>
    <div class="kpi ${c.high ? 'warn' : 'ok'}">
      <div class="kpi-label">High</div>
      <div class="kpi-value" style="color:${c.high ? 'var(--high)' : 'var(--ok)'}">${c.high}</div>
      <div class="kpi-delta t-dim">needs review</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Total open</div>
      <div class="kpi-value">${total}</div>
      <div class="kpi-delta t-dim">${state.scans.length} scans recorded</div>
    </div>
  </div>

  <div class="grid g-2">
    <div class="card">
      <div class="card-head">
        <h3>Security score over time</h3>
        <span class="sub">every scan, newest at the right</span>
      </div>
      ${trendChart(pts)}
    </div>

    <div class="card">
      <div class="card-head"><h3>Current scan</h3></div>
      <div class="ring-wrap">
        ${scoreRing(d.score, d.grade)}
        <div class="ring-meta">
          <div style="font-size:14px;color:var(--text);font-weight:600;margin-bottom:8px">
            ${esc(d.target)}</div>
          <div>Scanned ${relTime(d.startedAt)} · ${d.durationMs}ms</div>
          <div style="margin-top:8px">
            ${SEV_ORDER.filter((s) => c[s]).map((s) =>
              `<span class="sev ${s}">${c[s]} ${s}</span>`).join(' ') || '<span class="t-dim">no findings</span>'}
          </div>
        </div>
      </div>
      <div style="margin-top:20px;padding-top:18px;border-top:1px solid var(--border)">
        <div class="kpi-label" style="margin-bottom:12px">Findings by severity</div>
        ${SEV_ORDER.map((s) => {
          const max = Math.max(1, ...SEV_ORDER.map((x) => c[x]));
          const colors = { critical: '#fb4a5e', high: '#fb923c', medium: '#facc15', low: '#60a5fa', info: '#7f91ad' };
          return `<div class="bar-row">
            <div class="bar-label">${s}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(c[s] / max) * 100}%;background:${colors[s]}"></div></div>
            <div class="bar-num">${c[s]}</div>
          </div>`;
        }).join('')}
      </div>
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-head">
      <h3>Most urgent</h3>
      <span class="sub">critical and high, highest first</span>
      <div class="right"><button class="btn" data-goto="findings">View all ${currentFindings().length}</button></div>
    </div>
    ${currentFindings().filter((f) => f.severity === 'critical' || f.severity === 'high')
      .slice(0, 4).map(findingCard).join('') || '<div class="empty">Nothing critical or high. Good.</div>'}
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-head">
      <h3>Scan history</h3>
      <span class="sub">click any row to load it</span>
    </div>
    <table>
      <thead><tr><th>Target</th><th>When</th><th>Duration</th><th>Score</th><th>Findings</th></tr></thead>
      <tbody>${state.scans.map((s) => `
        <tr class="click" onclick="select('${esc(s.id)}')" style="${s.id === state.selected ? 'background:var(--panel-2)' : ''}">
          <td class="t-mono">${esc(s.target)}</td>
          <td class="t-dim">${fmtDate(s.startedAt)} · ${relTime(s.startedAt)}</td>
          <td class="t-dim">${s.durationMs}ms</td>
          <td><span style="color:${scoreColor(s.score)};font-weight:650">${s.score}</span>
              <span class="grade-${esc(s.grade)} t-dim"> (${esc(s.grade)})</span></td>
          <td class="t-num">${s.findings.length}</td>
        </tr>`).join('')}</tbody>
    </table>
  </div>`;
}

/* ---------- trend chart ---------- */

function trendChart(points) {
  if (points.length < 2) {
    return '<div class="empty">Not enough scans to draw a trend.</div>';
  }
  const W = 700, H = 210, P = 38;
  const xs = (i) => P + (i / (points.length - 1)) * (W - P * 2);
  const ys = (v) => H - P - (v / 100) * (H - P * 2);
  const line = points.map((p, i) => `${i ? 'L' : 'M'}${xs(i).toFixed(1)} ${ys(p.score).toFixed(1)}`).join(' ');
  const area = `${line} L${xs(points.length - 1).toFixed(1)} ${ys(0)} L${xs(0).toFixed(1)} ${ys(0)} Z`;
  const grids = [0, 25, 50, 75, 100].map((v) =>
    `<line class="grid-line" x1="${P}" y1="${ys(v)}" x2="${W - P}" y2="${ys(v)}"/>
     <text class="lbl" x="4" y="${ys(v) + 4}">${v}</text>`).join('');

  return `
  <div class="trend-wrap">
    <svg class="trend" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" id="trend-svg">
      <defs><linearGradient id="trendGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.34"/>
        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
      </linearGradient></defs>
      ${grids}
      <path class="area" d="${area}"/>
      <path class="line" d="${line}"/>
      ${points.map((p, i) => `<circle class="pt" cx="${xs(i).toFixed(1)}" cy="${ys(p.score).toFixed(1)}" r="4"
        data-i="${i}"><title>${fmtDate(p.at)} — score ${p.score}, ${p.findings} findings</title></circle>`).join('')}
      <text class="lbl" x="${P}" y="${H - 12}">${fmtDate(points[0].at)}</text>
      <text class="lbl" x="${W - P}" y="${H - 12}" text-anchor="end">${fmtDate(points[points.length - 1].at)}</text>
    </svg>
  </div>`;
}

/* ---------- findings ---------- */

function findingCard(f) {
  const loc = f.location?.file
    ? f.location.file + (f.location.line ? ':' + f.location.line : '')
    : (f.location?.component ?? '—');
  const comp = (f.compliance ?? []).filter((c) => c.relevant).slice(0, 4);

  return `
  <details class="finding sev-border-${esc(f.severity)}">
    <summary>
      <span class="sev ${esc(f.severity)}">${esc(f.severity)}</span>
      <span class="f-title">${esc(f.title)}</span>
      <span class="f-loc">${esc(loc)}</span>
    </summary>
    <div class="f-body">
      <p>${esc(f.description)}</p>
      <div class="f-meta">
        <div><dt>Rule</dt><dd><span class="chip">${esc(f.ruleId)}</span></dd></div>
        ${f.taxonomy ? `<div><dt>OWASP Agentic</dt><dd>${esc(f.taxonomy)}</dd></div>` : ''}
        ${f.cwe ? `<div><dt>CWE</dt><dd>${esc(f.cwe)}</dd></div>` : ''}
        <div><dt>Confidence</dt><dd>${esc(f.confidence)}</dd></div>
        <div><dt>Location</dt><dd class="t-mono">${esc(loc)}</dd></div>
      </div>
      ${f.evidence ? `<pre>${esc(f.evidence)}</pre>` : ''}
      <div class="f-fix">
        <h5>→ ${esc(f.remediation?.title ?? 'Remediation')}${f.remediation?.automated ? ' <span class="chip accent" style="margin-left:6px">auto-fixable</span>' : ''}</h5>
        <p>${esc(f.remediation?.description ?? '')}</p>
      </div>
      ${comp.length ? `<div style="margin-top:14px">
        <div class="kpi-label" style="margin-bottom:7px">Compliance</div>
        ${comp.map((c) => `<span class="chip">${esc(c.framework)}/${esc(c.control)}</span>`).join('')}
      </div>` : ''}
    </div>
  </details>`;
}

function viewFindings() {
  const f = currentFindings();
  const bySeverity = SEV_ORDER.map((s) => [s, f.filter((x) => x.severity === s)]).filter(([, a]) => a.length);

  return `
  <div class="card">
    <div class="card-head">
      <h3>${f.length} open finding${f.length === 1 ? '' : 's'}</h3>
      <span class="sub">${esc(state.detail?.target ?? '')}</span>
      <div class="right">
        <div class="btn-group" id="sev-filter">
          <button data-sev="all" class="on">All</button>
          ${SEV_ORDER.filter((s) => counts()[s]).map((s) =>
            `<button data-sev="${s}">${s}</button>`).join('')}
        </div>
      </div>
    </div>
    <div id="findings-list">
      ${bySeverity.map(([, items]) => items.map(findingCard).join('')).join('')
        || '<div class="empty"><div class="big">✓</div>No findings in this scan.</div>'}
    </div>
  </div>

  <div class="card" style="margin-top:16px">
    <div class="card-head"><h3>Framework coverage</h3>
      <span class="sub">controls these findings intersect</span></div>
    ${complianceRollup()}
  </div>`;
}

/* ---------- compliance rollup ---------- */

function complianceRollup() {
  const map = new Map();
  for (const f of currentFindings()) {
    for (const c of (f.compliance ?? []).filter((x) => x.relevant)) {
      const k = `${c.framework}/${c.control}`;
      const e = map.get(k) ?? { count: 0, title: c.title, worst: 'info' };
      e.count++;
      if (SEV_ORDER.indexOf(f.severity) < SEV_ORDER.indexOf(e.worst)) e.worst = f.severity;
      map.set(k, e);
    }
  }
  const entries = [...map.entries()].sort((a, b) =>
    SEV_ORDER.indexOf(a[1].worst) - SEV_ORDER.indexOf(b[1].worst) || b[1].count - a[1].count);
  if (!entries.length) return '<div class="empty">No compliance mappings.</div>';

  return `<table>
    <thead><tr><th>Control</th><th>Title</th><th>Findings</th><th>Worst</th></tr></thead>
    <tbody>${entries.map(([k, e]) => `
      <tr>
        <td><span class="chip accent">${esc(k)}</span></td>
        <td class="t-dim">${esc(e.title ?? '')}</td>
        <td class="t-num">${e.count}</td>
        <td><span class="sev ${esc(e.worst)}">${esc(e.worst)}</span></td>
      </tr>`).join('')}</tbody></table>
  <div class="note" style="margin-top:14px">
    <b>Aegis does not assess compliance.</b> It reports which controls your findings intersect.
    "No findings" means Aegis found nothing — not that a control operates effectively. Only an auditor can attest that.
  </div>`;
}

/* ---------- graph ---------- */

const NODE_COLORS = {
  server: '#2563eb', tool: '#0ea5e9', resource: '#7c3aed', prompt: '#a855f7',
  dataset: '#f59e0b', credential: '#e11d48', 'external-service': '#64748b', agent: '#10b981',
};

let sim = null;

function viewGraph() {
  const data = state.detail?.artifacts?.supplyChainGraph;
  if (!data?.nodes?.length) {
    return `<div class="card"><div class="empty">
      <div class="big">◉</div>
      <p>No supply chain graph in this scan.</p>
      <p class="t-dim" style="margin-top:8px">Run against a directory containing <code>mcp.json</code>,
      or use <code class="chip accent">--include-processes</code>.</p>
    </div></div>`;
  }

  const stats = data.stats ?? {};
  return `
  <div class="grid kpis">
    ${stat('Servers', stats.serverCount)}
    ${stat('Tools', stats.toolCount)}
    ${stat('Data flows', stats.edgeCount)}
    ${stat('Exfiltration paths', (stats.exfiltrationPaths ?? []).length,
      (stats.exfiltrationPaths ?? []).length ? 'crit' : 'ok')}
  </div>

  <div class="card">
    <div class="card-head">
      <h3>MCP supply chain graph</h3>
      <span class="sub">drag nodes · hover for detail · red arrows are exfiltration paths</span>
      <div class="right">
        <div class="btn-group" id="graph-mode">
          <button data-mode="risk" class="on">By risk</button>
          <button data-mode="kind">By kind</button>
        </div>
      </div>
    </div>
    <div class="graph-host" id="graph-host">
      <svg id="graph-svg"></svg>
      <div class="graph-tip" id="graph-tip"></div>
      <div class="graph-legend">
        ${Object.entries(NODE_COLORS).map(([k, v]) =>
          `<span><span class="legend-dot" style="background:${v}"></span>${k}</span>`).join('')}
      </div>
    </div>
  </div>

  ${(stats.exfiltrationPaths ?? []).length ? `
  <div class="card" style="margin-top:16px">
    <div class="card-head">
      <h3>Exfiltration paths</h3>
      <span class="sub">data that can reach the network</span>
    </div>
    ${stats.exfiltrationPaths.map((p) => `
      <div style="padding:9px 0;border-bottom:1px solid var(--border)">
        ${p.map((n, i) => {
          const node = data.nodes.find((x) => x.id === n);
          const color = node ? (NODE_COLORS[node.kind] ?? '#64748b') : '#64748b';
          return `<span class="chip" style="border-color:${color}55;color:${color}">${esc(node?.label ?? n)}</span>${
            i < p.length - 1 ? '<span class="t-dim"> → </span>' : ''}`;
        }).join('')}
      </div>`).join('')}
    <div class="note warn" style="margin-top:14px">
      Each path runs from a credential or sensitive dataset to the outbound network.
      Individually the tools on either end are unremarkable — the chain is the vulnerability.
    </div>
  </div>` : ''}`;
}

function stat(label, value, cls = '') {
  return `<div class="kpi ${cls}">
    <div class="kpi-label">${label}</div>
    <div class="kpi-value">${value ?? 0}</div>
  </div>`;
}

function drawGraph(data, mode = 'risk') {
  const svg = $('#graph-svg');
  if (!svg) return;
  const host = $('#graph-host');
  const W = host.clientWidth || 900, H = 460;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const nodes = data.nodes.map((n) => ({ ...n }));
  const index = new Map(nodes.map((n) => [n.id, n]));
  const links = data.links
    .map((l) => ({ ...l, s: index.get(l.source), t: index.get(l.target) }))
    .filter((l) => l.s && l.t);

  let g = svg.querySelector('#g');
  if (!g) {
    g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    svg.appendChild(g);
  }
  g.innerHTML = '';

  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
    return el;
  };

  const linkEls = links.map((l) => g.appendChild(mk('line', {
    stroke: l.kind === 'exfiltrates-to' ? '#e11d48' : '#25334f',
    'stroke-width': 1 + l.weight * 2.2,
    'stroke-dasharray': l.kind === 'exfiltrates-to' ? '5 4' : null,
    opacity: l.kind === 'exfiltrates-to' ? 0.85 : 0.5,
  })));

  const nodeEls = nodes.map((n) => {
    const c = mk('circle', {
      r: Math.max(5, Math.min(24, n.radius ?? 10)),
      fill: mode === 'risk'
        ? (n.risk >= 0.85 ? '#e11d48' : n.risk >= 0.6 ? '#f97316' : n.risk >= 0.35 ? '#f59e0b' : '#34d399')
        : (NODE_COLORS[n.kind] ?? '#64748b'),
      stroke: '#070b14', 'stroke-width': 2,
      cursor: 'pointer',
    });
    const tip = $('#graph-tip');
    c.addEventListener('mouseenter', (ev) => {
      tip.innerHTML = `<b>${esc(n.label)}</b>
        <span class="k">${esc(n.kind)}</span> · <span class="k">risk ${n.risk}</span>
        ${(n.references ?? []).length ? `<br/><span class="k">${esc(n.references.join(', '))}</span>` : ''}
        ${(n.references ?? []).length ? '' : ''}`;
      tip.classList.add('on');
      const r = svg.getBoundingClientRect();
      tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 200) + 'px';
      tip.style.top = (ev.clientY - r.top + 12) + 'px';
    });
    c.addEventListener('mouseleave', () => tip.classList.remove('on'));
    g.appendChild(c);
    return c;
  });

  const labelEls = nodes.map((n) => {
    const t = mk('text', {
      'font-size': 10.5, fill: '#b6c5dd', 'pointer-events': 'none',
    });
    t.textContent = (n.risk >= 0.45 || mode === 'kind') ? n.label : '';
    g.appendChild(t);
    return t;
  });

  // Force simulation, written here so the dashboard has no dependencies.
  let alpha = 1;
  const step = () => {
    // Repulsion.
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy || 1;
        const minD = (a.radius ?? 10) + (b.radius ?? 10) + 58;
        if (d2 < minD * minD) {
          const d = Math.sqrt(d2);
          const push = (minD - d) * 0.5 * alpha;
          dx /= d; dy /= d;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        }
      }
    }
    // Springs.
    for (const l of links) {
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const rest = 108;
      const f = ((d - rest) / d) * 0.055 * alpha;
      l.s.x += dx * f; l.s.y += dy * f;
      l.t.x -= dx * f; l.t.y -= dy * f;
    }
    // Gravity + bounds.
    for (const n of nodes) {
      n.x += (W / 2 - n.x) * 0.012;
      n.y += (H / 2 - n.y) * 0.016;
      const m = 26;
      n.x = Math.max(m, Math.min(W - m, n.x));
      n.y = Math.max(m, Math.min(H - m, n.y));
    }
    links.forEach((l, i) => {
      linkEls[i].setAttribute('x1', l.s.x); linkEls[i].setAttribute('y1', l.s.y);
      linkEls[i].setAttribute('x2', l.t.x); linkEls[i].setAttribute('y2', l.t.y);
    });
    nodes.forEach((n, i) => {
      nodeEls[i].setAttribute('cx', n.x); nodeEls[i].setAttribute('cy', n.y);
      labelEls[i].setAttribute('x', n.x + (n.radius ?? 10) + 5);
      labelEls[i].setAttribute('y', n.y + 3.5);
    });
    alpha *= 0.985;
  };

  // Seed positions on a spiral so the layout is stable, not random.
  nodes.forEach((n, i) => {
    const angle = i * 2.4;
    const rad = 40 + i * 11;
    n.x = W / 2 + Math.cos(angle) * rad;
    n.y = H / 2 + Math.sin(angle) * rad;
  });

  let frames = 0;
  const loop = () => {
    step();
    if (frames++ < 400) sim = requestAnimationFrame(loop);
    else sim = null;
  };
  if (sim) cancelAnimationFrame(sim);
  loop();
}

/* ---------- compliance ---------- */

function viewCompliance() {
  const rows = [];
  const seen = new Map();
  for (const f of currentFindings()) {
    for (const c of (f.compliance ?? [])) {
      const k = `${c.framework}/${c.control}`;
      const e = seen.get(k) ?? { title: c.title, relevant: 0, total: 0, worst: 'info' };
      e.total++;
      if (c.relevant) {
        e.relevant++;
        if (SEV_ORDER.indexOf(f.severity) < SEV_ORDER.indexOf(e.worst)) e.worst = f.severity;
      }
      seen.set(k, e);
    }
  }
  for (const [k, v] of seen) rows.push([k, v]);

  const byFramework = new Map();
  for (const [k, v] of rows) {
    const fw = k.split('/')[0];
    byFramework.set(fw, (byFramework.get(fw) ?? 0) + v.relevant);
  }

  return `
  <div class="grid kpis">
    ${[...byFramework].map(([fw, n]) =>
      `<div class="kpi"><div class="kpi-label">${esc(fw)}</div><div class="kpi-value">${n}</div>
       <div class="kpi-delta t-dim">controls hit</div></div>`).join('')}

      <thead><tr><th>Control</th><th>Title</th><th>Direct</th><th>Worst</th></tr></thead>

          <td class="t-dim">${esc(v.title ?? '')}</td>
          <td class="t-num">${v.relevant}</td>

}

          .map((id, i, arr) => {

function drawIntel(data, mode) {
  const svg = $('#intel-svg');
  if (!svg) return;
  const host = $('#intel-host');
  const W = host.clientWidth || 900, H = 460;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);

  const nodes = data.nodes.map((n) => ({ ...n }));
  const index = new Map(nodes.map((n) => [n.id, n]));
  const links = data.links.map((l) => ({ ...l, s: index.get(l.source), t: index.get(l.target) }))
    .filter((l) => l.s && l.t);

  let g = svg.querySelector('#g');
  if (!g) { g = document.createElementNS('http://www.w3.org/2000/svg', 'g'); svg.appendChild(g); }
  g.innerHTML = '';
  const NS = 'http://www.w3.org/2000/svg';
  const mk = (tag, attrs) => {
    const el = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) if (v !== null) el.setAttribute(k, v);
    return el;
  };

  const EDGE_COLOR = { enables: '#fb923c', mitigates: '#34d399', requires: '#818cf8', exploits: '#e11d48' };
  const linkEls = links.map((l) => g.appendChild(mk('line', {
    stroke: EDGE_COLOR[l.kind] ?? '#25334f',
    'stroke-width': 1.4, 'stroke-dasharray': l.kind === 'mitigates' ? '4 4' : null,
    opacity: 0.7,
  })));

  const severityColor = (r) => r >= 0.9 ? '#e11d48' : r >= 0.7 ? '#f97316' : r >= 0.45 ? '#f59e0b' : '#34d399';
  const kindColor = { technique: '#e11d48', vulnerability: '#f97316', 'supply-chain': '#fbbf24', tool: '#0ea5e9', control: '#34d399' };

  const nodeEls = nodes.map((n) => {
    const c = mk('circle', {
      r: Math.max(5, n.radius), fill: mode === 'risk' ? severityColor(n.risk) : (kindColor[n.kind] ?? '#64748b'),
      stroke: '#070b14', 'stroke-width': 2, cursor: 'pointer',
    });
    const tip = $('#intel-tip');
    c.addEventListener('mouseenter', (ev) => {
      tip.innerHTML = `<b>${esc(n.label)}</b><span class="k">${esc(n.kind)}</span>${
        n.references.length ? `<br/><span class="k">${esc(n.references.join(', '))}</span>` : ''}`;
      tip.classList.add('on');
      const r = svg.getBoundingClientRect();
      tip.style.left = Math.min(ev.clientX - r.left + 14, r.width - 200) + 'px';
      tip.style.top = (ev.clientY - r.top + 12) + 'px';
    });
    c.addEventListener('mouseleave', () => tip.classList.remove('on'));
    g.appendChild(c);
    return c;
  });
  const labelEls = nodes.map((n) => {
    const t = mk('text', { 'font-size': 11, fill: '#c5d3e8', 'pointer-events': 'none' });
    t.textContent = n.label;
    g.appendChild(t);
    return t;
  });

  nodes.forEach((n, i) => {
    const a = i * 2.399;
    const r = 60 + i * 14;
    n.x = W / 2 + Math.cos(a) * r;
    n.y = H / 2 + Math.sin(a) * r;
  });

  let frames = 0;
  const step = () => {
    for (let i = 0; i < nodes.length; i++) {
      for (let j = i + 1; j < nodes.length; j++) {
        const a = nodes[i], b = nodes[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy || 1;
        const minD = a.radius + b.radius + 74;
        if (d2 < minD * minD) {
          const d = Math.sqrt(d2), push = (minD - d) * 0.5;
          dx /= d; dy /= d;
          a.x -= dx * push; a.y -= dy * push;
          b.x += dx * push; b.y += dy * push;
        }
      }
    }
    for (const l of links) {
      const dx = l.t.x - l.s.x, dy = l.t.y - l.s.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 1;
      const rest = l.kind === 'mitigates' ? 145 : 112;
      const f = ((d - rest) / d) * 0.05;
      l.s.x += dx * f; l.s.y += dy * f;
      l.t.x -= dx * f; l.t.y -= dy * f;
    }
    for (const n of nodes) {
      n.x += (W / 2 - n.x) * 0.011; n.y += (H / 2 - n.y) * 0.015;
      n.x = Math.max(28, Math.min(W - 28, n.x));
      n.y = Math.max(24, Math.min(H - 24, n.y));
    }
    links.forEach((l, i) => {
      linkEls[i].setAttribute('x1', l.s.x); linkEls[i].setAttribute('y1', l.s.y);
      linkEls[i].setAttribute('x2', l.t.x); linkEls[i].setAttribute('y2', l.t.y);
    });
    nodes.forEach((n, i) => {
      nodeEls[i].setAttribute('cx', n.x); nodeEls[i].setAttribute('cy', n.y);
      labelEls[i].setAttribute('x', n.x + n.radius + 5);
      labelEls[i].setAttribute('y', n.y + 3.5);
    });
  };
  for (let i = 0; i < 420; i++) step();
}

  state.selected = id;
  state.detail = await api('/api/scans/' + encodeURIComponent(id));
  render();
  if (state.view === 'graph') setView('graph');
}

async function refresh() {
  state.error = null;
  await load();
  render();
  if (state.view === 'graph') setView('graph');
  if (state.view === 'intel') setView('intel');
}

function runScan() {
  window.open('https://github.com/aegis-security/aegis', '_blank', 'noopener');
}

/**
 * Build the threat-graph payload used by every intel render.
 *
 * `ATTACK_EDGES` is authored as `[source, target, kind]` tuples, but the
 * renderer expects objects with `source`/`target`/`kind` fields. Passing the
 * tuples straight through made `index.get(l.source)` resolve to undefined and
 * every edge was silently filtered out — the graph rendered as 21 isolated
 * dots with no relationships, which is worse than no graph at all.
 */
function intelData() {
  const nodes = ATTACK_NODES.map(([id, label, kind, risk, refs]) =>
    ({ id, label, kind, risk, references: refs, radius: 6 + risk * 16 }));
  const ids = new Set(nodes.map((n) => n.id));

  const links = ATTACK_EDGES
    .filter(([source, target]) => ids.has(source) && ids.has(target))
    .map(([source, target, kind]) => ({
      source, target, kind,
      weight: kind === 'mitigates' ? 0.4 : 0.8,
    }));

  return { nodes, links };
}

/* ---------- events ---------- */

// Inline handlers cannot reach module scope, so every control is wired here.
$('#btn-refresh').addEventListener('click', refresh);
$('#btn-scan').addEventListener('click', () =>
  window.open('https://github.com/aegis-security/aegis', '_blank', 'noopener'));

document.addEventListener('click', (ev) => {
  const nav = ev.target.closest('.nav a');
  if (nav) { ev.preventDefault(); setView(nav.dataset.view); return; }

  const goto = ev.target.closest('[data-goto]');
  if (goto) { setView(goto.dataset.goto); return; }

  const range = ev.target.closest('#range button');
  if (range) {
    state.days = Number(range.dataset.days);
    $$('#range button').forEach((b) => b.classList.toggle('on', b === range));
    render();
    return;
  }

  const gm = ev.target.closest('#graph-mode button');
  if (gm) {
    $$('#graph-mode button').forEach((b) => b.classList.toggle('on', b === gm));
    const data = state.detail?.artifacts?.supplyChainGraph;
    if (data) drawGraph(data, gm.dataset.mode);
    return;
  }

  const im = ev.target.closest('#intel-mode button');
  if (im) {
    $$('#intel-mode button').forEach((b) => b.classList.toggle('on', b === im));
    drawIntel(intelData(), im.dataset.mode);
    return;
  }

  const sf = ev.target.closest('#sev-filter button');
  if (sf) {
    $$('#sev-filter button').forEach((b) => b.classList.toggle('on', b === sf));
    const sev = sf.dataset.sev;
    const list = $('#findings-list');
    if (list) {
      const f = currentFindings().filter((x) => sev === 'all' || x.severity === sev);
      list.innerHTML = f.map(findingCard).join('') || '<div class="empty">Nothing at this severity.</div>';
    }
  }
});

$('#token').addEventListener('keydown', (e) => { if (e.key === 'Enter') refresh(); });

window.addEventListener('resize', () => {
  if (state.view === 'graph') {
    const d = state.detail?.artifacts?.supplyChainGraph;
    if (d?.nodes?.length) drawGraph(d);
  }
  if (state.view === 'intel') {
    drawIntel(intelData());
  }
});

/* ---------- boot ---------- */

(async () => {
  const hash = location.hash.replace('#', '');
  if (VIEWS[hash]) state.view = hash;
  await load();
  render();
})();
</script>
</body>
</html>
