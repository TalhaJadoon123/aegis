id: secrets
version: 1.0.0
name: Secret Detection
description: >-
  High-confidence credential patterns plus an entropy sweep, so that secrets
  without a known prefix are still caught. Every match is verified against a
  deny-list of obvious placeholders to keep the signal-to-noise ratio usable in
  CI.

rules:
  - id: AEGIS-SEC-001
    title: Provider API key literal
    description: >-
      A key issued by an AI, cloud, or SaaS provider is written directly in
      source. These keys are high-value: they are rate-limited only, rarely
      scoped, and frequently forwarded to model providers by the agent itself.
    severity: critical
    confidence: confirmed
    scanners: ['agent', 'repo', 'mcp']
    taxonomy: ASI03
    cwe: CWE-798
    tags: [secret]
    patterns:
      - type: regex
        pattern: '\bsk-proj-[A-Za-z0-9_\-]{20,}'
      - type: regex
        pattern: '\bsk-ant-[A-Za-z0-9_\-]{24,}'
      - type: regex
        pattern: '\bAIza[0-9A-Za-z_\-]{35}\b'
      - type: regex
        pattern: '\bAKIA[0-9A-Z]{16}\b'
      - type: regex
        pattern: '\bASIA[0-9A-Z]{16}\b'
      - type: regex
        pattern: '\bgh[pousr]_[A-Za-z0-9]{30,}'
      - type: regex
        pattern: '\bgithub_pat_[A-Za-z0-9_]{50,}'
      - type: regex
        pattern: '\bxox[baprs]-[0-9A-Za-z\-]{10,}'
      - type: regex
        pattern: '\bglpat-[A-Za-z0-9_\-]{20,}'
      - type: regex
        pattern: '\bnpm_[A-Za-z0-9]{36}\b'
      - type: regex
        pattern: '\bshpat_[a-fA-F0-9]{32}\b'
      - type: regex
        pattern: '\bSK[0-9a-fA-F]{32}\b'
      - type: regex
        pattern: '\bdop_v1_[a-f0-9]{64}\b'
      - type: regex
        pattern: '\bhf_[A-Za-z0-9]{34}\b'
      - type: regex
        pattern: '\b(?:api|secret|access)[_-]?(?:key|token)\s*[:=]\s*["''][A-Za-z0-9_\-\.]{24,}["'']'
    unless:
      - '(?i)(process\.env|os\.environ|getenv|ENV\[|Deno\.env|secrets\.|vault|gcp_secret|aws_secrets|example\.com|example\.org|xxxx|your[-_ ]?(api|secret|key|token)|placeholder|redacted|CHANGEME|REPLACE_ME|<[a-z_\-]+>|\$\{|\{[a-z_\-]+\}|dummy|fake|test[-_]?key|not[-_]?a[-_]?real|AAAA|1111|1234)'
    remediation:
      title: Rotate the key and load it from a secret manager
      description: >-
        Treat the key as compromised: revoke it, issue a new one scoped to the
        minimum required permissions, and store it in your platform's secret
        manager. Add the fingerprint to the deny-list only after rotation.
      automated: true
      effort: trivial
      patch: |
        # before
        OPENAI_API_KEY = "sk-proj-abc..."
        # after
        OPENAI_API_KEY = os.environ["OPENAI_API_KEY"]
        # and rotate the exposed key at the provider.
    compliance:
      - framework: soc2
        control: 'CC6.1'
        relevant: true
      - framework: iso27001
        control: 'A.5.17'
        relevant: true
      - framework: gdpr
        control: 'Art. 32'
        relevant: true
      - framework: owasp-agentic
        control: ASI03
        relevant: true

  - id: AEGIS-SEC-002
    title: Private key material in the repository
    description: A PEM-encoded private key is committed. In an agent repository this is reachable by every tool with filesystem access.
    severity: critical
    confidence: confirmed
    scanners: ['agent', 'repo']
    taxonomy: ASI03
    cwe: CWE-312
    tags: [secret, crypto]
    patterns:
      - type: regex
        pattern: '-----BEGIN\s+(RSA|DSA|EC|OPENSSH|PGP|ENCRYPTED)?\s*PRIVATE KEY(\s+BLOCK)?-----'
      - type: regex
        pattern: '-----BEGIN\s+CERTIFICATE-----[\s\S]{0,4000}?-----BEGIN\s+(RSA|EC|OPENSSH)?\s*PRIVATE KEY'
    remediation:
      title: Remove the key and rotate the credential
      description: 'Delete the file, revoke the associated certificate/key pair, and load secrets from a mounted secret at runtime.'
      automated: true
      effort: trivial
    compliance:
      - framework: soc2
        control: 'CC6.1'
        relevant: true
      - framework: iso27001
        control: 'A.5.17'
        relevant: true

  - id: AEGIS-SEC-003
    title: High-entropy string that looks like a credential
    description: >-
      A long, high-entropy string appears next to a credential-like assignment.
      These are tokens without a recognisable vendor prefix, so pattern matching
      alone misses them.
    severity: high
    confidence: medium
    scanners: ['agent', 'repo']
    taxonomy: ASI03
    cwe: CWE-798
    tags: [secret, entropy]
    patterns:
      - type: entropy
        min: 4.3
        pattern: '(?i)(?:secret|token|key|password|passwd|credential|auth)[_-]?\w*\s*[:=]\s*["'']?([A-Za-z0-9+/=_\-]{24,})["'']?'
    unless:
      - '(?i)(process\.env|os\.environ|getenv|secrets\.|example|xxxx|placeholder|redacted|CHANGEME|<[^>]+>|\$\{|\{[a-z_]+\})'
    remediation:
      title: Confirm and rotate the value
      description: 'If this is a live credential, revoke it. If it is an identifier or hash used for caching, allowlist it explicitly with a comment.'
      automated: true
      effort: low
    compliance:
      - framework: soc2
        control: 'CC6.1'
        relevant: true
      - framework: iso27001
        control: 'A.5.17'
        relevant: true

  - id: AEGIS-SEC-004
    title: Connection string with an inline password
    description: A database, cache, or broker URI embeds a username and password. Connection strings end up in logs and error messages constantly.
    severity: high
    confidence: high
    scanners: ['agent', 'repo', 'mcp']
    taxonomy: ASI03
    cwe: CWE-798
    patterns:
      - type: regex
        pattern: '\b(?:postgres(?:ql)?|mysql|mongodb(?:\+srv)?|redis|amqp|rediss|clickhouse|mssql|ftp|sftp)://[^\s:@/"'']+:[^\s:@/"'']+@'
    unless:
      - '(?i)(example\.com|localhost|127\.0\.0\.1|user:password|:pass@|xxx|\*\*\*|process\.env|os\.environ|getenv|\$\{|\{)'
    remediation:
      title: Move the password out of the connection string
      description: 'Build the URI at runtime from environment variables, and never log the full DSN.'
      automated: true
      effort: trivial
    compliance:
      - framework: soc2
        control: 'CC6.1'
        relevant: true
      - framework: iso27001
        control: 'A.5.17'
        relevant: true
      - framework: gdpr
        control: 'Art. 32'
        relevant: true

  - id: AEGIS-SEC-005
    title: Secret assigned to a variable named like a prompt
    description: >-
      A credential is stored in a variable that is later interpolated into a
      prompt or logged. Secrets in the prompt context are secrets in every
      downstream model call, transcript, and telemetry pipeline.
    severity: high
    confidence: medium
    scanners: ['agent']
    taxonomy: ASI02
    cwe: CWE-532
    tags: [secret, data-leakage, logging]
    patterns:
      - type: regex
        pattern: '(?i)(prompt|message|content|context|system_prompt|user_prompt)\s*(\+=|=)\s*f?["''][^"'']*(api_key|apikey|token|secret|password|credential)'
      - type: regex
        pattern: '(?i)(print|log|logger\.|console\.(log|warn|error)|println)\s*\([^)\n]*(api_key|apikey|token|secret|password|credential)'
      - type: regex
        pattern: '(?i)f?["''][^"'']*(api[_-]?key|access[_-]?token|password|secret)[^"'']*\{(api_key|apikey|token|secret|password|credential)\}["'']'
    unless:
      - '(?i)(redact|mask|sanitize|\*\*\*|scrub|obfuscat|placeholder)'
    remediation:
      title: Redact secrets before they reach prompts and logs
      description: >-
        Scrub secrets from any string bound for a prompt, a log line, or a
        telemetry event. Prefer passing an opaque reference the agent can use to
        act without ever seeing the secret.
      automated: false
      effort: medium
    compliance:
      - framework: soc2
        control: 'CC6.1'
        relevant: true
      - framework: gdpr
        control: 'Art. 5'
        title: Data minimisation
        relevant: true
      - framework: gdpr
        control: 'Art. 32'
        relevant: true
      - framework: iso27001
        control: 'A.8.15'
        relevant: true
      - framework: owasp-agentic
        control: ASI02
        relevant: true

  - id: AEGIS-SEC-006
    title: Secret committed to a dotenv file that is not ignored
    description: >-
      A `.env` file with real values sits in the working tree. If it is not in
      `.gitignore` it will be committed; if it is committed it is already leaked.
    severity: high
    confidence: medium
    scanners: ['repo', 'agent']
    taxonomy: ASI04
    cwe: CWE-538
    tags: [secret, hygiene]
    patterns:
      - type: regex
        pattern: '^\s*(?:export\s+)?[A-Z0-9_]*(?:KEY|TOKEN|SECRET|PASSWORD|CREDENTIAL)[A-Z0-9_]*\s*=\s*[^\s"''$][^\n]{8,}'
    unless:
      - '(?i)(change[_-]?me|example|placeholder|your[_-]|xxxx|\$\{|#)'
    remediation:
      title: Ignore .env files and commit a template instead
      description: 'Add `.env` to `.gitignore`, commit `.env.example` with empty values, and rotate anything that was already committed.'
      automated: true
      effort: trivial
      patch: |
        # .gitignore
        .env
        .env.*
        !.env.example
    compliance:
      - framework: soc2
        control: 'CC6.1'
        relevant: true
      - framework: iso27001
        control: 'A.5.17'
        relevant: true
