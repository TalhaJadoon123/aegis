name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Aegis has zero runtime dependencies, so verification needs no install
      # step. TypeScript is the only dev dependency, and only for typechecking.
      - name: Install TypeScript for typechecking
        run: npm install --no-save --no-audit --no-fund typescript@5.7.2

      - name: Typecheck
        run: npm run typecheck

      # The version is duplicated across manifests, constants, the chart and the
      # installers; drift breaks the download URL or the chart's image tag.
      - name: Release metadata is consistent
        run: npm run check:versions

      # The runner discovers test files itself, so a new test file cannot be
      # silently omitted from the pipeline -- which is how three suites went
      # missing from `npm test` before.
      - name: Unit and integration tests
        run: npm run test:unit

      - name: End-to-end CLI tests
        run: npm run test:e2e

      - name: Product smoke check
        run: npm run smoke

      - name: Production readiness gate
        run: npm run readiness

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # `npm run package` runs tsc. Each job is a fresh runner, so the
      # typechecker installed in the verify job is not present here.
      - name: Install TypeScript for the build
        run: npm install --no-save --no-audit --no-fund typescript@5.7.2

      # `npm run package` compiles, stages, verifies and packs. Do not replace
      # this with a bare `npm pack`: `aegis.package.json` points `bin` at
      # `build/publish/**`, which only exists after tsc runs, and Node cannot
      # strip types under node_modules. A bare pack ships a tarball whose
      # entry point does not exist.
      - name: Build the publishable tarball
        run: npm run package

      - name: Verify the tarball installs and runs as a consumer
        run: npm run package:verify

      # A supply-chain-relevant assertion for a tool that ships itself: the
      # published package must have no installable dependencies at all.
      - name: Verify the tarball declares zero dependencies
        run: |
          node -e "
            const p = require('./aegis.package.json');
            const deps = Object.keys(p.dependencies ?? {});
            if (deps.length) { console.error('tarball has dependencies:', deps); process.exit(1); }
            console.log('zero runtime dependencies confirmed');
          "

      - name: Smoke-test the published entry point
        run: |
          mkdir -p /tmp/aegis-install && cd /tmp/aegis-install
          npm init -y >/dev/null
          npm install "$GITHUB_WORKSPACE"/dist/*.tgz
          npx aegis --version
          npx aegis --help | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: aegis-tarball
          path: dist/*.tgz

  # Spec Kit checklist gate
  checklist:
    name: Spec Kit Checklist
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Run Spec Kit checklists for all specs
      - name: Run Spec Kit checklists
        run: |
          node --experimental-strip-types --import ./tools/register-ts.mjs scripts/checklist.mts

  # Helm chart lint: the chart is a shipped artifact, so a template that does
  # not parse must fail CI instead of failing a customer's `helm install`.
  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.4

      - name: Lint with default values
        run: helm lint infra/helm/aegis

      - name: Lint with every optional resource enabled
        run: |
          helm lint infra/helm/aegis \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true \
            --set persistence.existingClaim=demo-claim

      - name: Render every template
        run: |
          helm template aegis infra/helm/aegis \
            --set serviceMonitor.enabled=true \
            --set ingress.enabled=true > /tmp/rendered.yaml
          grep -q 'kind: Deployment' /tmp/rendered.yaml
          grep -q 'kind: Ingress' /tmp/rendered.yaml
          grep -q 'kind: ServiceMonitor' /tmp/rendered.yaml

      - name: Package the chart
        run: helm package infra/helm/aegis -d dist

  # Docker build for air-gap deployments
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Aegis Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/sandbox/Dockerfile
          tags: aegis:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image runs
        run: |
          docker run --rm aegis:latest --version
          docker run --rm aegis:latest --help

      # `helm install` runs the dashboard, so the image must serve it. This was
      # once broken: the server looked for index.html inside the scan-data
      # directory and returned 404 for its own UI.
      - name: Test the dashboard serves from the image
        run: |
          set -euo pipefail
          docker run -d --name aegis-ci -p 18080:8080 \
            -e AEGIS_DASHBOARD_TOKEN=ci-smoke \
            aegis:latest desktop --no-open --host 0.0.0.0 --port 8080 --data /tmp/aegis

          trap 'docker rm -f aegis-ci >/dev/null 2>&1 || true' EXIT

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 1
          done

          echo '--- /healthz ---'
          curl -fsS http://127.0.0.1:18080/healthz
          echo
          echo '--- / (dashboard UI) ---'
          curl -fsS http://127.0.0.1:18080/ | grep -qi '<title>'
          echo '--- /app.css ---'
          curl -fsS -o /dev/null -w 'status=%{http_code} type=%{content_type}\n' \
            http://127.0.0.1:18080/app.css
          echo '--- /metrics ---'
          curl -fsS http://127.0.0.1:18080/metrics | head -3

  self-scan:
    name: Aegis scans itself
    runs-on: ubuntu-latest
    needs: verify
    timeout-minutes: 10
    # upload-sarif writes code-scanning results, which the workflow-level
    # `contents: read` token cannot do. Without this the job fails after the
    # scan has already succeeded.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Dogfooding. The exit code is deliberately ignored: the point is to
      # surface findings for review, not to gate on Aegis's opinion of itself.
      - name: Self-scan
        run: |
          node --import ./tools/register-ts.mjs packages/cli/src/bin.ts scan . \
            --no-connect --no-spawn \
            --format sarif --output aegis.sarif || true

      - name: Assert the self-scan stays precise
        run: |
          # A regression gate on false positives. Aegis scanning its own source
          # is deliberately harsh: the test fixtures contain vulnerable code on
          # purpose. The ceilings are a ratchet -- they must only ever go down.
          # Baseline on 2026-10-24: 63 findings, 53 at error level.
          node --experimental-strip-types scripts/check-self-scan.mts aegis.sarif

      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: aegis.sarif
          category: aegis-self-scan